name: Build 64bit
# Parallel workflow for the 64bit branch. Mirrors build-release.yml's
# packaging behaviour but adds an arch matrix (i386 + amd64 + aarch64
# on Linux, x86 on Windows). Uses the goldsrc-net/build-containers
# debian10 image — same base (debian:buster + clang-11) as upstream
# amxmodx's release CI, just with cross-toolchain + multilib additions
# baked in. glibc floor for produced binaries is 2.28 (debian:buster).
# Master-branch CI is unaffected.

on:
  push:
    branches:
      - 64bit
  pull_request:
    branches:
      - 64bit
  workflow_dispatch:

env:
  MYSQL_VERSION: '5.5'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux i386 (legacy; same image as master CI — upstream's
          # debian10 base, just with our additions superset.)
          - platform: linux
            target_arch: i386
            os: ubuntu-latest
            os_short: linux
            container_image: ghcr.io/goldsrc-net/build-containers/debian10:latest

          # Linux amd64 (new for this branch)
          - platform: linux
            target_arch: amd64
            os: ubuntu-latest
            os_short: linux
            container_image: ghcr.io/goldsrc-net/build-containers/debian10:latest

          # Linux aarch64 — runs on the native arm64 runner so AMBuild's
          # compile-and-run probe works without qemu/binfmt. The
          # build-containers/debian10 image publishes both linux/amd64
          # and linux/arm64 manifests; this row pulls the arm64 one.
          - platform: linux
            target_arch: aarch64
            os: ubuntu-24.04-arm
            os_short: linux
            container_image: ghcr.io/goldsrc-net/build-containers/debian10:latest

          # Windows x86 (legacy; matches master CI.)
          - platform: windows
            target_arch: i386
            os: windows-latest
            os_short: win

          # Windows amd64 (new for this branch — feeds ReHLDS Win64).
          - platform: windows
            target_arch: amd64
            os: windows-latest
            os_short: win

    name: ${{ matrix.platform }}-${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container_image }}

    steps:
      # build-containers/debian10 bakes in: clang-11, gcc-multilib +
      # libc6-dev-i386, gcc-aarch64-linux-gnu cross + arm64 multiarch
      # runtime, cmake (Kitware 3.29.6), rsync, nasm, libmariadb-dev,
      # ambuild. No per-job apt install needed for the standard set.

      - name: Checkout AMX Mod X
        uses: actions/checkout@v6
        with:
          path: amxmodx
          fetch-depth: 0
          submodules: recursive

      - name: Resolve paths
        id: path_helper
        shell: bash
        run: |
          echo "dependencies=$GITHUB_WORKSPACE/dependencies" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v5
        env:
          cache-name: amxx-deps-64bit
        with:
          path: ${{ steps.path_helper.outputs.dependencies }}
          key: ${{ runner.os }}-${{ matrix.target_arch }}-build-${{ env.cache-name }}-mysql${{ env.MYSQL_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target_arch }}-build-${{ env.cache-name }}-

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p '${{ steps.path_helper.outputs.dependencies }}'
          cd '${{ steps.path_helper.outputs.dependencies }}'

          # Pre-clone hlsdk from the goldsrc-net/hlsdk @ 64bit fork before
          # running checkout-deps.sh. Upstream alliedmodders/hlsdk has
          # extdll.h's `#define max(a,b) ...` which collides with the
          # C++17 stdlib (cmath → tr1/ell_integral pulls std::max) and
          # breaks the build. The 64bit fork renames these to minm/maxm.
          # checkout-deps.sh's checkout function is a no-op when the
          # target dir already exists, so this pre-clone wins.
          if [ ! -d hlsdk ]; then
            git clone --depth=1 -b 64bit https://github.com/goldsrc-net/hlsdk
          fi

          # Satisfy checkout-deps requirement for an "amxmodx" folder.
          mkdir -p amxmodx
          ../amxmodx/support/checkout-deps.sh

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target_arch == 'amd64' && 'x64' || 'x86' }}

      - name: Setup NASM (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/setup-nasm@v1

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          DEPS='${{ steps.path_helper.outputs.dependencies }}'
          mkdir -p "$DEPS"
          cd "$DEPS"

          if [ ! -d "metamod-am" ]; then
            git clone https://github.com/alliedmodders/metamod-hl1 metamod-am
          fi
          if [ ! -d "hlsdk" ]; then
            # 64bit branch of the goldsrc-net fork; carries the
            # min/max → minm/maxm rename so amxmodx's C++ stdlib
            # template chains (algorithm, cmath, string, ...) don't
            # collide with extdll.h's function-like macros.
            git clone -b 64bit https://github.com/goldsrc-net/hlsdk
          fi
          if [ ! -d "mysql-${{ env.MYSQL_VERSION }}" ]; then
            # mysql-connector-c 6.1.1 was shipped as both -win32 and
            # -winx64 (matched archive ids on the MySQL archives CDN).
            if [ "${{ matrix.target_arch }}" = "amd64" ]; then
              MYSQL_ZIP="mysql-connector-c-6.1.1-winx64.zip"
            else
              MYSQL_ZIP="mysql-connector-c-6.1.1-win32.zip"
            fi
            curl -sSL -o mysql-connector.zip \
              "https://downloads.mysql.com/archives/get/p/19/file/${MYSQL_ZIP}"
            7z x mysql-connector.zip
            mv "${MYSQL_ZIP%.zip}" "mysql-${{ env.MYSQL_VERSION }}"
            rm mysql-connector.zip
          fi

          if [ ! -d "ambuild" ]; then
            git clone https://github.com/alliedmodders/ambuild
          fi
          pip install ./ambuild

      - name: Build
        working-directory: amxmodx
        shell: bash
        run: |
          DEPS='${{ steps.path_helper.outputs.dependencies }}'
          mkdir build
          cd build
          # The 64bit branch added --target-arch={i386,amd64,aarch64}
          # (Phase 1) and --mysql=system to let the build pick up the
          # distro-installed libmariadb on amd64/aarch64 where there's
          # no prebuilt 32-bit mysql connector.
          MYSQL_FLAG="--mysql=$DEPS/mysql-${{ env.MYSQL_VERSION }}"
          if [ "${{ matrix.platform }}" = "linux" ] && \
             [ "${{ matrix.target_arch }}" != "i386" ]; then
            MYSQL_FLAG="--mysql=system"
          fi
          python3 ../configure.py \
            --target-arch=${{ matrix.target_arch }} \
            --enable-optimize \
            --symbol-files \
            "--metamod=$DEPS/metamod-am" \
            "--hlsdk=$DEPS/hlsdk" \
            "$MYSQL_FLAG"
          ambuild

      - name: Package
        id: package
        working-directory: amxmodx/build
        shell: bash
        run: |
          version_base=$(cat ../product.version)
          version_base=${version_base%-dev}
          version_rev=$(git rev-list --count HEAD)
          version="${version_base}.${version_rev}"
          expanded_version="${version_base}-git${version_rev}"

          packages=(base cstrike dod esf ns tfc ts)
          release_dir="release"
          mkdir -p "$release_dir"

          for pkg in "${packages[@]}"; do
            pkg_dir="packages/$pkg"
            if [ ! -d "$pkg_dir" ]; then
              echo "Warning: package directory $pkg_dir not found, skipping"
              continue
            fi

            if [ "${{ matrix.platform }}" = "windows" ]; then
              filename="amxmodx-${expanded_version}-${pkg}-${{ matrix.platform }}-${{ matrix.target_arch }}.zip"
              (cd "$pkg_dir" && 7z a "../../${release_dir}/${filename}" addons)
            else
              filename="amxmodx-${expanded_version}-${pkg}-${{ matrix.platform }}-${{ matrix.target_arch }}.tar.gz"
              tar zcf "${release_dir}/${filename}" -C "$pkg_dir" addons
            fi
          done

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "expanded_version=$expanded_version" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amxmodx-${{ matrix.platform }}-${{ matrix.target_arch }}
          path: amxmodx/build/release/*

      # Only push to a release on direct 64bit branch pushes,
      # not PR runs (PRs from forks don't have GITHUB_TOKEN write).
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/64bit'
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          replacesArtifacts: false
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          omitBody: true

          artifacts: amxmodx/build/release/*
          artifactContentType: ${{ matrix.platform == 'windows' && 'application/zip' || 'application/gzip' }}
          artifactErrorsFailBuild: false

          tag: 64bit-${{ steps.package.outputs.version }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true

          draft: false
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
